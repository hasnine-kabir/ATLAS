[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "JARVIS-style voice assistant for Windows 11"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Hasnine Kabir" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.0",
    "types-psutil>=6.0.0",
    "cosmic-ray>=8.3.0",
]
audio = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]
stt = [
    "faster-whisper>=1.0.0",
]
tts = [
    "pyttsx3>=2.90",
]
llm = [
    "google-genai>=2.0.0",
]
windows = [
    "pywin32>=306",
    "comtypes>=1.4.0",
    "send2trash>=1.8.0",
    "rapidfuzz>=3.9.0",
]

[project.scripts]
atlas = "atlas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
include = ["*.py", "*.pyi"]
extend-exclude = ["*.md", "plans"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pyttsx3.*",
    "sounddevice.*",
    "faster_whisper.*",
    "openwakeword.*",
    "send2trash.*",
    "rapidfuzz.*",
    "cosmic_ray.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "windows: tests that require Windows native OS APIs (excluded from standard CI)",
    "slow: tests that take more than a second to run",
]

[tool.coverage.run]
source = ["atlas"]
omit = [
    "tests/*",
    "docs/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
